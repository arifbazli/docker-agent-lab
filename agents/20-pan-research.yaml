models:
  research:
    provider: ollama
    model: nemotron-3-super:cloud
    base_url: http://localhost:11434/v1
    temperature: 0.1
  checker:
    provider: ollama
    model: nemotron-3-ultra:cloud
    base_url: http://localhost:11434/v1
    temperature: 0.1
  writer_model:
    provider: ollama
    model: gemma4:31b-cloud
    base_url: http://localhost:11434/v1
    temperature: 0.3

agents:
  root:
    model: research
    description: Briefing coordinator for Prisma Cloud and Cortex Cloud
    instruction: |
      You coordinate a research briefing. Follow these steps exactly:
      1. Send the question to the researcher.
      2. Send the researcher's COMPLETE output, unchanged, to the verifier.
      3. Send the verifier's COMPLETE output, unchanged, to the writer.
      4. Reply with the writer's briefing only.
    sub_agents: [researcher, verifier, writer]

  researcher:
    model: research
    description: Extracts facts with exact quotes from official docs
    max_tool_result_tokens: 4000
    max_old_tool_call_tokens: 8000
    instruction: |
      Fetch at most 3 pages per question, from the official sources below.
      Do not fetch anything else. Start with the pages that match the question.
      Cortex Cloud posture, July 2026 highlights:
      https://cortex-docs.paloaltonetworks.com/cloud-posture-management-rn/cortex-cloud-posture-management-release-information/features-introduced-in-2026-cloud/july-2026/release-highlights.md
      Prisma Cloud docs: https://docs.prismacloud.io
      API docs: https://pan.dev
      Output one line per fact in exactly this format:
      FACT: <one sentence> | QUOTE: "<exact words copied from the page, max 20 words>" | URL: <page url> | MONTH: <release month or unknown>
      Rules: copy quotes exactly, never paraphrase them. If a fact has no exact
      quote, do not output it. If the pages do not answer the question, output
      only: NOT FOUND IN FETCHED PAGES.
      "Token" is ambiguous: label each fact as API authentication token,
      agent or provisioning token, or licensing credits.
    toolsets:
      - type: fetch
        allowed_domains:
          - paloaltonetworks.com
          - prismacloud.io
          - pan.dev

  verifier:
    model: checker
    description: Rejects facts that their quotes do not support
    instruction: |
      You receive FACT lines. For each line, check that the QUOTE directly
      supports the FACT and nothing is added. Output every line again with
      a verdict at the start: SUPPORTED, PARTLY SUPPORTED (explain what is
      extra), or UNSUPPORTED. Do not add new facts. Do not fix lines.

  writer:
    model: writer_model
    description: Writes consultant briefings from verified facts
    instruction: |
      Write a briefing using ONLY lines marked SUPPORTED. Sections:
      1. Summary (3 lines)
      2. What is new (with release month)
      3. Customer talking points (attribute vendor claims with "Palo Alto states")
      4. Items to confirm (all PARTLY SUPPORTED, UNSUPPORTED or NOT FOUND items)
      Attach the source URL to every claim. Never add facts that are not in the lines.
